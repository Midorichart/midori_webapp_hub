<!doctype html>
<html lang="ko" spellcheck="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>みどり</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib/mhchem.min.js"></script>
</head>
<body>
  <div id="app" hidden>
    <header class="topbar">
      <a class="home-link" href="../index.html" title="학습 대시보드">⌂</a>
      <div class="brand">みどり<span id="brand-subject"></span></div>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="concepts">개념</button>
        <button type="button" role="tab" data-tab="notes">오답노트</button>
        <button type="button" role="tab" data-tab="formulas">수식</button>
        <button type="button" role="tab" data-tab="memos">암기</button>
        <button type="button" role="tab" data-tab="elements" hidden>주기율표</button>
      </nav>
      <div class="backup">
        <button type="button" class="ghost" id="export-btn" title="모든 데이터(이미지 포함)를 JSON 파일로 저장">내보내기</button>
        <label class="ghost button" title="JSON 백업 파일을 불러와 추가">가져오기<input type="file" id="import-input" accept="application/json,.json" hidden></label>
      </div>
    </header>

    <main class="wide">
      <!-- 개념 / 오답노트: 왼쪽 단원 트리 + 오른쪽 페이지 -->
      <section class="panel split" id="tab-concepts" hidden>
        <aside class="side card">
          <div class="side-head">
            <input type="search" class="search" data-search="concepts" placeholder="개념 검색">
            <button type="button" class="primary" data-newpage="concepts">+ 새 개념</button>
          </div>
          <div class="side-opts"><span class="count" id="concepts-count"></span><button type="button" class="chip" data-showempty="concepts">빈 단원도 보기</button></div>
          <nav class="tree-wrap" id="concepts-tree"></nav>
        </aside>
        <div class="main" id="concepts-main"></div>
      </section>

      <section class="panel split" id="tab-notes" hidden>
        <aside class="side card">
          <div class="side-head">
            <input type="search" class="search" data-search="notes" placeholder="오답 검색">
            <button type="button" class="primary" data-newpage="notes">+ 새 오답</button>
          </div>
          <div class="side-opts"><span class="count" id="notes-count"></span><button type="button" class="chip" data-showempty="notes">빈 단원도 보기</button></div>
          <nav class="tree-wrap" id="notes-tree"></nav>
        </aside>
        <div class="main" id="notes-main"></div>
      </section>

      <!-- 수식 / 암기: 등록한 블록 모음 -->
      <section class="panel split" id="tab-formulas" hidden>
        <aside class="side card">
          <div class="side-head"><input type="search" class="search" data-search="formulas" placeholder="수식 검색"></div>
          <div class="side-opts"><span class="count" id="formulas-count"></span><button type="button" class="chip" data-showempty="formulas">빈 단원도 보기</button></div>
          <nav class="tree-wrap" id="formulas-tree"></nav>
        </aside>
        <div class="main">
          <div class="toolbar"><span class="filter-label" id="formulas-filter"></span><button type="button" class="chip" data-rhide="formulas">수식 가리기</button></div>
          <div id="formulas-list" class="r-list"></div>
        </div>
      </section>

      <section class="panel split" id="tab-memos" hidden>
        <aside class="side card">
          <div class="side-head"><input type="search" class="search" data-search="memos" placeholder="암기 사항 검색"></div>
          <div class="side-opts"><span class="count" id="memos-count"></span><button type="button" class="chip" data-showempty="memos">빈 단원도 보기</button></div>
          <nav class="tree-wrap" id="memos-tree"></nav>
        </aside>
        <div class="main">
          <div class="toolbar"><span class="filter-label" id="memos-filter"></span><button type="button" class="chip" data-rhide="memos">내용 가리기</button></div>
          <div id="memos-list" class="r-list"></div>
        </div>
      </section>

      <!-- 주기율표 (화학) -->
      <section class="panel" id="tab-elements" hidden>
        <div class="toolbar">
          <input type="search" class="search" data-search="elements" placeholder="번호 · 기호 · 이름 검색">
          <div class="seg" id="el-view" role="group" aria-label="보기">
            <button type="button" data-elview="list">목록</button>
            <button type="button" data-elview="table">주기율표</button>
          </div>
          <span class="count" id="elements-count"></span>
        </div>
        <div id="elements-body"></div>
      </section>
    </main>
  </div>

  <!-- 수식/암기 등록 단원 고르기 -->
  <div class="modal" id="unit-modal" hidden>
    <div class="modal-backdrop" data-ucancel></div>
    <form class="modal-card unit-card" id="unit-form" role="dialog" aria-modal="true" aria-labelledby="unit-q">
      <h3 id="unit-q"></h3>
      <label class="check"><input type="checkbox" name="ref"> 현재 섹션의 단원 참조</label>
      <p class="unit-cur" id="unit-cur"></p>
      <select name="unit" aria-label="단원"></select>
      <div class="form-actions"><button type="button" data-ucancel>취소</button><button type="submit" class="primary">등록</button></div>
    </form>
  </div>

  <div class="lightbox" id="lightbox" hidden><img alt=""></div>
  <input type="file" id="img-input" accept="image/*" multiple hidden>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../config.js"></script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
