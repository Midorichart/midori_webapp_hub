<!DOCTYPE html>
<html lang="ko">
<head>
<script src="../auth.js?v=73d71f95"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0c" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>수익 통계 · Studio Raming</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="../../assets/site.css?v=81784b6c">
<style>
  :root { --ok: #127c55; --warn: #a65a00; }
  @media (prefers-color-scheme: dark) { :root { --ok: #3ccf91; --warn: #e3a03c; } }
  select { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- 머리말 ---------- */
  .page-head { padding: 28px 0 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-head h1 { margin: 0; font-size: clamp(28px, 4vw, 38px); letter-spacing: -0.035em; line-height: 1.15; }
  .sync { margin: 8px 0 0; color: var(--ink-2); font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sync .warn { color: var(--warn); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }

  /* ---------- 필터 ---------- */
  .filters {
    position: sticky;
    top: 8px;
    z-index: 5;
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 28px;
  }
  .f-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .f-label { font-size: 12.5px; font-weight: 600; color: var(--mute); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button {
    height: 32px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    background: var(--surface);
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-2);
    cursor: pointer;
  }
  .chips button:hover { color: var(--ink); background: var(--surface-2); }
  .chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); }
  .period { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ctl { height: 34px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-size: 14px; }
  .ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  .period .to { color: var(--mute); }
  #reset { margin-left: auto; }

  /* ---------- 어제 / 오늘 ---------- */
  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .panel { padding: 22px; min-width: 0; }
  .day { min-height: 240px; }
  .day-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .day-head h2 { margin: 0; font-size: 20px; letter-spacing: -0.025em; }
  .panel-sub { margin: 3px 0 0; font-size: 13px; color: var(--mute); }
  .day-sum { text-align: right; }
  .day-total { font-size: 30px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.15; white-space: nowrap; }

  /* ---------- 표 ---------- */
  .table-wrap { margin-top: 14px; overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--mute); padding: 0 8px 8px; white-space: nowrap; }
  .tbl td { padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  .tbl .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl th:first-child, .tbl td:first-child { padding-left: 0; }
  .tbl th:last-child, .tbl td:last-child { padding-right: 0; }
  .tbl tfoot td { font-weight: 700; }
  .time { width: 52px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .time a { text-decoration: none; color: var(--ink-2); }
  .time a:hover { color: var(--ink); text-decoration: underline; }
  .it + .it { margin-top: 4px; }
  .pname { font-weight: 600; line-height: 1.35; }
  .meta { font-size: 12px; color: var(--mute); margin-left: 6px; white-space: nowrap; }
  .gift { font-size: 11px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 0 7px; margin-left: 6px; white-space: nowrap; }
  .empty { color: var(--mute); font-size: 14px; padding: 28px 0 8px; margin: 0; }

  /* ---------- 기간 매출 ---------- */
  .sec-head { margin: 36px 0 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sec-head h2 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
  .sec-head p { margin: 0; color: var(--ink-2); font-size: 14px; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .kpi { padding: 18px 20px 16px; min-width: 0; }
  .kpi-label { font-size: 13px; color: var(--mute); font-weight: 600; }
  .kpi-value { margin-top: 6px; font-size: 26px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.2; white-space: nowrap; }
  .kpi-note { margin-top: 6px; font-size: 13px; color: var(--mute); min-height: 20px; }
  .kpi-note b { font-weight: 600; }
  .up { color: var(--up); }
  .down { color: var(--down); }

  .cat-card + .cat-card { margin-top: 12px; }
  .cat-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .cat-head h3 { margin: 0; font-size: 17px; letter-spacing: -0.02em; }
  .cat-total { text-align: right; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; }

  .legend { list-style: none; margin: 16px 0 4px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); }
  .legend li { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .ln { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .ln.rest { background: repeating-linear-gradient(90deg, var(--mute) 0 4px, transparent 4px 7px); }

  .chart { position: relative; height: 220px; margin-top: 4px; touch-action: pan-y; outline: none; }
  .chart:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
  .chart svg { display: block; overflow: visible; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .base { stroke: var(--axis); stroke-width: 1; }
  .chart .tick { fill: var(--mute); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .chart .tick-sub { fill: var(--mute); font-size: 11px; opacity: 0.75; }
  .chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .line.rest { stroke: var(--mute); stroke-dasharray: 4 3; }
  .chart .xh { stroke: var(--axis); stroke-width: 1; }
  .chart .pt { stroke: var(--surface); stroke-width: 2; }
  .chart .today { fill: var(--mute); font-size: 11px; }

  .tip {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    min-width: 200px;
    max-width: 300px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--line-2);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    font-size: 13px;
    pointer-events: none;
  }
  .tip-title { font-weight: 700; margin-bottom: 6px; }
  .tip-row { display: flex; align-items: center; gap: 7px; color: var(--ink-2); line-height: 1.75; }
  .tip-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tip-row .v { margin-left: auto; padding-left: 10px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tip-row .v small { color: var(--mute); font-size: 12px; margin-left: 4px; }

  .rank { width: 26px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .pcell { display: flex; align-items: flex-start; gap: 8px; }
  .pcell .ln { margin-top: 9px; }
  .pcell .ln.none { background: none; }
  .share { width: 24%; min-width: 96px; }
  .share-bar { display: flex; align-items: center; gap: 8px; }
  .share-bar i { display: block; height: 8px; border-radius: 0 4px 4px 0; min-width: 2px; background: var(--axis); }
  .share-bar span { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .more { margin-top: 12px; width: 100%; }

  .footnote { margin: 20px 0 0; font-size: 12.5px; color: var(--mute); }
  .is-loading main { opacity: 0.55; transition: opacity 200ms; }

  /* ---------- 로그인 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    place-items: center;
    padding: 16px;
    background: color-mix(in srgb, var(--page) 70%, transparent);
    backdrop-filter: blur(6px);
  }
  .overlay.show { display: grid; }
  .login { width: min(380px, 100%); padding: 28px; }
  .login h2 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
  .login p { margin: 6px 0 20px; color: var(--ink-2); font-size: 14px; }
  .field { display: block; margin-bottom: 10px; }
  .field span { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
  .field input { width: 100%; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--page); font-size: 15px; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .login .btn { width: 100%; height: 42px; margin-top: 8px; }
  .err { color: var(--down); font-size: 13px; min-height: 18px; margin-top: 4px; }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .days { grid-template-columns: 1fr; }
    #todayCard { order: -1; }
  }
  @media (max-width: 640px) {
    .page-head { padding: 12px 0 16px; }
    .filters { position: static; padding: 12px; gap: 12px; }
    .f-group { width: 100%; }
    .f-label { width: 100%; }
    #reset { margin-left: 0; }
    .period .ctl[type="date"] { flex: 1; min-width: 0; }
    #preset { width: 100%; }
    .panel { padding: 18px 16px; }
    .day { min-height: 0; }
    .day-total { font-size: 24px; }
    .kpi { padding: 14px 16px; }
    .kpi-value { font-size: 21px; }
    .cat-total { font-size: 18px; }
    .chart { height: 190px; }
    .share, .rank { display: none; }
  }
</style>
</head>

<header class="site-head">
  <a class="brand" href="../"><span class="brand-mark"></span>midorichart</a>
  <div class="head-meta"><span id="who"></span><button class="btn ghost" id="logout" hidden>로그아웃</button></div>

<main class="wrap">
  <section class="page-head">
    <div>
      <p class="eyebrow">Studio Raming · BOOTH</p>

      <p class="sync" id="sync">불러오는 중…</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=d40faf52"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cfg = window.SALES_CONFIG || {};

  // ================= 상품 분류 =================
  const CATS = [
    { key: 'env', label: 'WARUDO 배경', short: '배경' },
    { key: 'plugin', label: 'WARUDO 플러그인', short: '플러그인' },
    { key: 'unity', label: 'Unity 도구', short: '도구' },
    { key: 'etc', label: '기타', short: '기타' },
  ];
  const CAT = Object.fromEntries(CATS.map(c => [c.key, c]));

  // "[WARUDO/PRO+Standard] PhotoBooth 0.1.4｜フォトブース" → { name: "PhotoBooth", cat: "plugin" }
  const productCache = new Map();
  function product(raw) {
    if (productCache.has(raw)) return productCache.get(raw);
    let s = raw.trim(), tag = '';
    const m = s.match(/^\[?([^[\]]{1,40})\]\s*/);
    if (m) { tag = m[1]; s = s.slice(m[0].length); }
    s = s.split('｜')[0]
      .replace(/\s+v?\d+(\.\d+)+(\s*Update)?\s*$/i, '')
      .replace(/\s+Update$/i, '')
      .trim();
    const t = tag.toLowerCase();
    let cat = 'etc';
    if (t.includes('unity') || /^unity\b/i.test(s)) cat = 'unity';
    else if (/environment|urp|brp|^(warudo )?standard\/pro$/.test(t)) cat = 'env';
    else if (t.includes('warudo')) cat = 'plugin';
    const p = { name: s || raw, cat };
    productCache.set(raw, p);
    return p;
  }

  // ================= 날짜 (모두 JST 기준 값을 getUTC* 로 읽음) =================
  const DAY = 864e5, JST = 9 * 3600e3;
  const dayStart = ms => { const d = new Date(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
  const today = () => dayStart(Date.now() + JST);
  const pad = n => String(n).padStart(2, '0');
  const parts = ms => { const d = new Date(ms); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), dow: d.getUTCDay() }; };
  const DOW = '일월화수목금토';
  const fmtTime = ms => { const p = parts(ms); return `${pad(p.h)}:${pad(p.mi)}`; };
  const fmtDay = ms => { const p = parts(ms); return `${p.m}월 ${p.d}일 (${DOW[p.dow]})`; };
  const fmtLong = ms => { const p = parts(ms); return `${p.y}년 ${p.m}월 ${p.d}일`; };
  const fmtStamp = ms => { const p = parts(ms); return `${p.m}월 ${p.d}일 ${pad(p.h)}:${pad(p.mi)}`; };
  const toInput = ms => { const p = parts(ms); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; };
  const fromInput = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
  const monthStart = ms => { const p = parts(ms); return Date.UTC(p.y, p.m - 1, 1); };
  const monthEnd = ms => { const p = parts(ms); return Date.UTC(p.y, p.m, 1) - DAY; };
  function ago(ms) {
    const m = Math.floor(ms / 60e3);
    if (m < 1) return '방금';
    if (m < 60) return `${m}분 전`;
    if (m < 1440) return `${Math.floor(m / 60)}시간 전`;
    return `${Math.floor(m / 1440)}일 전`;
  }

  // ================= 숫자 =================
  const yen = v => '¥' + Math.round(v).toLocaleString('ja-JP');
  const compact = new Intl.NumberFormat('ko-KR', { notation: 'compact', maximumFractionDigits: 1 });
  const yenShort = v => (v === 0 ? '0' : '¥' + compact.format(v));
  const pct = v => (v * 100).toFixed(1).replace(/\.0$/, '') + '%';
  const count = v => Math.round(v).toLocaleString('ko-KR');

  // ================= 상태 =================
  // cats: 비어 있으면 전체. 기간은 [from, to] (둘 다 그날 0시, to 포함)
  const state = { orders: [], cats: new Set(), preset: '', from: 0, to: 0, showAll: new Set(), loadedAt: 0, syncAt: null, live: false };

  function normalize(rows) {
    return rows
      .map(o => ({
        id: o.order_id,
        t: Date.parse(o.ordered_at) + JST,
        items: (o.items || []).map(i => ({ ...product(i.name), price: i.price, gift: !!i.gift })),
      }))
      .sort((a, b) => a.t - b.t);
  }

  // 카테고리 필터를 적용한 주문 (해당 카테고리 상품만 남기고, 금액도 그 상품들 합계)
  function pick(o) {
    const items = state.cats.size ? o.items.filter(i => state.cats.has(i.cat)) : o.items;
    return items.length ? { id: o.id, t: o.t, items, total: items.reduce((s, i) => s + i.price, 0) } : null;
  }
  const between = (a, b) => state.orders.filter(o => o.t >= a && o.t < b).map(pick).filter(Boolean);

  function summarize(list) {
    const revenue = list.reduce((s, o) => s + o.total, 0);
    const items = list.reduce((s, o) => s + o.items.length, 0);
    return { revenue, orders: list.length, items, avg: list.length ? revenue / list.length : 0 };
  }

  // ================= 기간 프리셋 =================
  const thisMonthKey = () => { const p = parts(today()); return `m:${p.y}-${pad(p.m)}`; };

  function presetRange(v) {
    const t = today();
    if (v.startsWith('m:')) {
      const [y, m] = v.slice(2).split('-').map(Number);
      const from = Date.UTC(y, m - 1, 1);
      return { from, to: monthEnd(from) };
    }
    if (v === 'ytd') return { from: Date.UTC(parts(t).y, 0, 1), to: t };
    if (v === 'all') return { from: state.orders.length ? dayStart(state.orders[0].t) : t, to: t };
    return null;
  }

  function setPreset(v) {
    const r = presetRange(v);
    if (!r) return;
    state.preset = v;
    state.from = r.from;
    state.to = r.to;
  }

  // 날짜를 직접 고쳤을 때, 딱 맞는 프리셋이 있으면 그걸로 표시
  function matchPreset() {
    for (const o of $('#preset').options) {
      const r = presetRange(o.value);
      if (r && r.from === state.from && r.to === state.to) return o.value;
    }
    return 'custom';
  }

  function renderPresetOptions() {
    const t = parts(today());
    const first = state.orders.length ? parts(state.orders[0].t) : t;
    let html = '<optgroup label="월">';
    for (let y = t.y, m = t.m; y > first.y || (y === first.y && m >= first.m);) {
      html += `<option value="m:${y}-${pad(m)}">${y}년 ${m}월${y === t.y && m === t.m ? ' (이번 달)' : ''}</option>`;
      if (--m === 0) { m = 12; y--; }
    }
    html += '</optgroup><optgroup label="기간"><option value="ytd">올해</option><option value="all">전체 기간</option><option value="custom">직접 선택</option></optgroup>';
    $('#preset').innerHTML = html;
  }

  // ================= 그리기 =================
  function render() {
    renderFilters();
    renderSync();
    renderDays();
    renderPeriod();
  }

  function renderFilters() {
    if (!$('#cats').children.length) {
      $('#cats').innerHTML = [{ key: '', short: '전체' }, ...CATS].map(c => `<button data-cat="${c.key}">${c.short}</button>`).join('');
    }
    for (const b of $('#cats').children) {
      const k = b.dataset.cat;
      b.setAttribute('aria-pressed', String(k ? state.cats.has(k) : state.cats.size === 0));
    }
    $('#preset').value = state.preset;
    $('#from').value = toInput(state.from);
    $('#to').value = toInput(state.to);
    const min = state.orders.length ? toInput(dayStart(state.orders[0].t)) : '';
    $('#from').min = $('#to').min = min;
    $('#reset').hidden = state.cats.size === 0 && state.preset === thisMonthKey();
  }

  function renderSync() {
    const el = $('#sync');
    if (!state.loadedAt) return;
    if (state.syncAt) {
      const age = Date.now() - state.syncAt;
      const stale = age > 20 * 60e3; // 5분마다 확인하므로 20분 넘게 소식이 없으면 PC 쪽 문제
      el.innerHTML = `<span class="dot ${stale ? 'warn' : 'ok'}"></span><span>데이터 업데이트 ${fmtStamp(state.syncAt + JST)} · ${ago(age)}</span>`
        + (stale ? '<span class="warn">동기화가 멈춘 것 같아요. PC의 ScriptHub를 확인해 주세요.</span>' : '');
    } else {
      const last = state.orders[state.orders.length - 1];
      el.innerHTML = `<span class="dot"></span><span>${last ? `마지막 주문 ${fmtStamp(last.t)}` : '아직 주문 데이터가 없어요.'}</span>`;
    }
  }

  // ---------- 어제 / 오늘 ----------
  function renderDays() {
    const t = today();
    dayCard($('#yesterdayCard'), '어제', t - DAY, '주문이 없었어요.');
    dayCard($('#todayCard'), '오늘', t, '아직 주문이 없어요.');
  }

  function dayCard(el, title, day, emptyText) {
    const list = between(day, day + DAY).reverse();
    const sum = summarize(list);
    const rows = list.map(o => `<tr>
        <td class="time"><a href="https://manage.booth.pm/orders/${encodeURIComponent(o.id)}" target="_blank" rel="noopener noreferrer" title="BOOTH 주문 #${esc(o.id)}">${fmtTime(o.t)}</a></td>
        <td>${o.items.map(i => `<div class="it"><span class="pname">${esc(i.name)}</span><span class="meta">${CAT[i.cat].short}${o.items.length > 1 ? ' · ' + yen(i.price) : ''}</span>${i.gift ? '<span class="gift">선물</span>' : ''}</div>`).join('')}</td>
        <td class="r">${yen(o.total)}</td>
      </tr>`).join('');
    el.innerHTML = `<div class="day-head">
        <div><h2>${title}</h2><p class="panel-sub">${fmtDay(day)}</p></div>
        <div class="day-sum"><div class="day-total num">${yen(sum.revenue)}</div><p class="panel-sub">${count(sum.orders)}건 · ${count(sum.items)}개</p></div>
      </div>
      ${list.length
        ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>시간</th><th>상품</th><th class="r">금액</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<p class="empty">${emptyText}</p>`}`;
  }

  // ---------- 기간 매출 ----------
  function comparison() {
    const t = today();
    if (state.preset === 'all') return null;
    const lastDay = Math.min(state.to, t);
    if (lastDay < state.from) return null;
    if (state.preset.startsWith('m:')) {
      const pStart = monthStart(state.from - DAY);
      const n = (lastDay - state.from) / DAY; // 이번 달이면 오늘까지와 같은 날 수만큼만 비교
      const pEnd = Math.min(pStart + n * DAY, monthEnd(pStart));
      return { start: pStart, end: pEnd + DAY, label: state.to > t ? '지난달 같은 기간 대비' : '지난달 대비' };
    }
    const n = (lastDay - state.from) / DAY + 1;
    return { start: state.from - n * DAY, end: state.from, label: `이전 ${n}일 대비` };
  }

  function delta(curV, prevV, label) {
    if (!prevV) return curV ? '<span>이전 기간 주문 없음</span>' : '';
    const r = curV / prevV - 1;
    if (Math.abs(r) < 0.0005) return '<span>변화 없음</span>';
    return `<b class="${r > 0 ? 'up' : 'down'}">${r > 0 ? '▲' : '▼'} ${pct(Math.abs(r))}</b> ${label}`;
  }

  function renderPeriod() {
    const list = between(state.from, state.to + DAY);
    const cur = summarize(list);
    const catText = state.cats.size ? ' · ' + CATS.filter(c => state.cats.has(c.key)).map(c => c.short).join(', ') : '';
    $('#periodLabel').textContent = `${fmtLong(state.from)} – ${fmtLong(state.to)}${catText}`;

    const cmp = comparison();
    let notes;
    if (cmp) {
      const before = summarize(between(cmp.start, cmp.end));
      notes = [delta(cur.revenue, before.revenue, cmp.label), delta(cur.orders, before.orders, cmp.label), delta(cur.items, before.items, cmp.label), delta(cur.avg, before.avg, cmp.label)];
    } else {
      const months = Math.max(1, (parts(state.to).y - parts(state.from).y) * 12 + parts(state.to).m - parts(state.from).m + 1);
      notes = [`월 평균 ${yenShort(cur.revenue / months)}`, `월 평균 ${(cur.orders / months).toFixed(1)}건`, cur.orders ? `주문당 ${(cur.items / cur.orders).toFixed(2)}개` : '', ''];
    }
    const tiles = [['매출', yen(cur.revenue)], ['주문', count(cur.orders) + '건'], ['판매 수량', count(cur.items) + '개'], ['주문당 평균', yen(cur.avg)]];
    $('#kpis').innerHTML = tiles.map(([label, value], i) =>
      `<div class="card kpi"><div class="kpi-label">${label}</div><div class="kpi-value num">${value}</div><div class="kpi-note">${notes[i]}</div></div>`
    ).join('');

    renderCategories(list, cur.revenue);
  }

  // 카테고리마다 카드 하나: 상품별 누적 매출 선 + 상품 표
  const SERIES = 4; // 선으로 따로 그리는 상품 수 (나머지는 '그 외' 한 줄)
  const ro = new ResizeObserver(entries => { for (const e of entries) if (e.target._model) drawLines(e.target); });

  function renderCategories(list, periodTotal) {
    ro.disconnect();
    const n = Math.round((state.to - state.from) / DAY) + 1;
    const lastIdx = Math.min(n - 1, Math.round((today() - state.from) / DAY));
    const shown = state.cats.size ? CATS.filter(c => state.cats.has(c.key)) : CATS;
    const host = $('#catCards');
    host.innerHTML = '';

    for (const c of shown) {
      const g = new Map();
      for (const o of list) for (const it of o.items) {
        if (it.cat !== c.key) continue;
        if (!g.has(it.name)) g.set(it.name, { name: it.name, qty: 0, revenue: 0, daily: new Float64Array(n) });
        const e = g.get(it.name);
        e.qty += 1;
        e.revenue += it.price;
        e.daily[Math.floor((dayStart(o.t) - state.from) / DAY)] += it.price;
      }
      const rows = [...g.values()].sort((a, b) => b.revenue - a.revenue || b.qty - a.qty);
      if (!rows.length && !state.cats.size) continue;
      const total = rows.reduce((s, r) => s + r.revenue, 0);
      const qty = rows.reduce((s, r) => s + r.qty, 0);

      const card = document.createElement('section');
      card.className = 'card panel cat-card';
      card.innerHTML = `<div class="cat-head">
          <div><h3>${c.label}</h3><p class="panel-sub">${rows.length ? `${rows.length}개 상품 · ${count(qty)}개 판매` : '이 기간에 팔린 상품이 없어요.'}</p></div>
          ${rows.length ? `<div><div class="cat-total num">${yen(total)}</div><p class="panel-sub" style="text-align:right">${state.cats.size === 1 ? '' : `기간 매출의 ${pct(total / periodTotal)}`}</p></div>` : ''}
        </div>`;
      host.appendChild(card);
      if (!rows.length) continue;

      // 선: 매출 상위 SERIES 개 + 나머지 합
      const series = rows.slice(0, SERIES).map((r, i) => ({ name: r.name, color: `var(--s${i + 1})`, daily: r.daily }));
      const rest = rows.slice(SERIES);
      if (rest.length) {
        const daily = new Float64Array(n);
        for (const r of rest) r.daily.forEach((v, i) => { daily[i] += v; });
        series.push({ name: `그 외 ${rest.length}개`, rest: true, daily });
      }
      for (const s of series) {
        s.cum = new Float64Array(lastIdx + 1);
        let acc = 0;
        for (let i = 0; i <= lastIdx; i++) { acc += s.daily[i]; s.cum[i] = acc; }
      }

      if (lastIdx >= 0) {
        const legend = document.createElement('ul');
        legend.className = 'legend';
        legend.innerHTML = series.map(s => `<li><span class="ln${s.rest ? ' rest' : ''}" style="${s.rest ? '' : `background:${s.color}`}"></span>${esc(s.name)}</li>`).join('');
        card.appendChild(legend);
        const chart = document.createElement('div');
        chart.className = 'chart';
        chart.tabIndex = 0;
        chart.setAttribute('aria-label', `${c.label} 상품별 누적 매출 차트. 좌우 화살표로 날짜를 이동합니다.`);
        chart._model = { n, lastIdx, from: state.from, series, max: Math.max(...series.map(s => s.cum[lastIdx])) };
        card.appendChild(chart);
        bindChart(chart);
        ro.observe(chart);
      }

      // 표
      const LIMIT = 8;
      const all = state.showAll.has(c.key);
      const visible = all ? rows : rows.slice(0, LIMIT);
      const max = rows[0].revenue;
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      wrap.innerHTML = `<table class="tbl"><thead><tr><th class="rank">#</th><th>상품</th><th class="r">수량</th><th class="r">매출</th><th class="share">비중</th></tr></thead><tbody>${
        visible.map((r, i) => `<tr>
          <td class="rank">${i + 1}</td>
          <td><div class="pcell"><span class="ln${i < SERIES ? '' : ' none'}" style="${i < SERIES ? `background:var(--s${i + 1})` : ''}"></span><span class="pname">${esc(r.name)}</span></div></td>
          <td class="r">${count(r.qty)}</td>
          <td class="r">${yen(r.revenue)}</td>
          <td class="share"><div class="share-bar"><i style="width:${(r.revenue / max) * 70}%"></i><span>${pct(r.revenue / total)}</span></div></td>
        </tr>`).join('')
      }</tbody></table>`;
      card.appendChild(wrap);
      if (rows.length > LIMIT) {
        const more = document.createElement('button');
        more.className = 'btn more';
        more.textContent = all ? '접기' : `전체 ${rows.length}개 보기`;
        more.onclick = () => { all ? state.showAll.delete(c.key) : state.showAll.add(c.key); renderPeriod(); };
        card.appendChild(more);
      }
    }
    if (!host.children.length) host.innerHTML = '<section class="card panel"><p class="empty" style="padding:8px 0">이 기간에는 주문이 없어요.</p></section>';
  }

  // ---------- 누적 매출 선 차트 ----------
  function niceScale(max) {
    if (max <= 0) return { step: 1, top: 4 };
    const raw = max / 4, p = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 2.5, 5, 10].map(k => k * p).find(s => s >= raw);
    return { step, top: Math.ceil(max / step) * step };
  }

  function drawLines(el) {
    const m = el._model;
    const W = Math.max(el.clientWidth, 240), H = el.clientHeight;
    const P = { l: 52, r: 14, t: 14, b: 40 };
    const pw = W - P.l - P.r, ph = H - P.t - P.b;
    const { step, top } = niceScale(m.max);
    const x = i => P.l + (m.n === 1 ? pw / 2 : (i / (m.n - 1)) * pw);
    const y = v => P.t + ph - (v / top) * ph;

    let s = `<svg width="${W}" height="${H}" aria-hidden="true">`;
    for (let v = step; v <= top + step / 2; v += step) {
      const yy = Math.round(y(v)) + 0.5;
      s += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}"/><text class="tick" x="${P.l - 10}" y="${yy + 4}" text-anchor="end">${yenShort(v)}</text>`;
    }
    s += `<text class="tick" x="${P.l - 10}" y="${y(0) + 4}" text-anchor="end">0</text>`;
    s += `<line class="base" x1="${P.l}" x2="${W - P.r}" y1="${Math.round(y(0)) + 0.5}" y2="${Math.round(y(0)) + 0.5}"/>`;

    // x축: 짧은 기간은 날짜, 긴 기간은 매달 1일
    const long = m.n > 62;
    const every = Math.max(1, Math.ceil(m.n / Math.max(2, Math.floor(pw / 40))));
    let lastCtx = null;
    for (let i = 0; i < m.n; i++) {
      const p = parts(m.from + i * DAY);
      if (long ? p.d !== 1 : i % every) continue;
      const main = long ? `${p.m}월` : String(p.d), ctx = long ? String(p.y) : `${p.m}월`;
      s += `<text class="tick" x="${x(i)}" y="${H - P.b + 18}" text-anchor="middle">${main}</text>`;
      if (ctx !== lastCtx) s += `<text class="tick-sub" x="${x(i)}" y="${H - P.b + 33}" text-anchor="middle">${ctx}</text>`;
      lastCtx = ctx;
    }

    // 기간이 오늘 이후까지면 오늘 위치 표시
    if (m.lastIdx < m.n - 1) {
      const tx = x(m.lastIdx);
      s += `<line class="xh" x1="${tx}" x2="${tx}" y1="${P.t}" y2="${y(0)}" stroke-dasharray="2 3"/><text class="today" x="${tx + 5}" y="${P.t + 10}">오늘</text>`;
    }

    // '그 외' 를 맨 아래에, 1위가 맨 위에 오도록 거꾸로 그림
    for (const sr of [...m.series].reverse()) {
      const d = Array.from(sr.cum, (v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
      s += `<path class="line${sr.rest ? ' rest' : ''}" d="${d}" style="${sr.rest ? '' : `stroke:${sr.color}`}"/>`;
    }
    s += `<g class="hover" visibility="hidden"><line class="xh" y1="${P.t}" y2="${y(0)}"/>${
      m.series.map(sr => `<circle class="pt" r="4.5" style="fill:${sr.rest ? 'var(--mute)' : sr.color}"/>`).join('')
    }</g></svg><div class="tip" hidden></div>`;
    el.innerHTML = s;
    el._geo = { x, y, P, W, pw };
    if (el._active != null) showTip(el, el._active);
  }

  function showTip(el, i) {
    const m = el._model, g = el._geo;
    if (!g) return;
    i = Math.max(0, Math.min(m.lastIdx, i));
    el._active = i;
    const hover = el.querySelector('.hover');
    const cx = g.x(i);
    const xh = hover.querySelector('line');
    xh.setAttribute('x1', cx);
    xh.setAttribute('x2', cx);
    hover.querySelectorAll('circle').forEach((c, k) => { c.setAttribute('cx', cx); c.setAttribute('cy', g.y(m.series[k].cum[i])); });
    hover.setAttribute('visibility', 'visible');

    const tip = el.querySelector('.tip');
    const rows = m.series.map(sr => {
      const day = sr.daily[i];
      return `<div class="tip-row"><span class="ln${sr.rest ? ' rest' : ''}" style="${sr.rest ? '' : `background:${sr.color}`}"></span><span class="n">${esc(sr.name)}</span><span class="v">${yen(sr.cum[i])}${day ? `<small>+${yen(day)}</small>` : ''}</span></div>`;
    }).join('');
    tip.innerHTML = `<div class="tip-title">${fmtDay(m.from + i * DAY)}까지 누적</div>${rows}`;
    tip.hidden = false;
    const w = tip.offsetWidth;
    let left = cx + 14;
    if (left + w > g.W) left = cx - 14 - w;
    tip.style.transform = `translate(${Math.max(0, left)}px, ${g.P.t}px)`;
  }

  function hideTip(el) {
    el._active = null;
    const hover = el.querySelector('.hover');
    if (hover) hover.setAttribute('visibility', 'hidden');
    const tip = el.querySelector('.tip');
    if (tip) tip.hidden = true;
  }

  function bindChart(el) {
    el.addEventListener('pointermove', e => {
      const g = el._geo, m = el._model;
      if (!g) return;
      const rx = e.clientX - el.getBoundingClientRect().left - g.P.l;
      if (rx < -10 || rx > g.pw + 10) return hideTip(el);
      showTip(el, m.n === 1 ? 0 : Math.round((rx / g.pw) * (m.n - 1)));
    });
    el.addEventListener('pointerleave', () => hideTip(el));
    el.addEventListener('blur', () => hideTip(el));
    el.addEventListener('keydown', e => {
      if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      e.preventDefault();
      const cur = el._active ?? (e.key === 'ArrowLeft' ? el._model.lastIdx + 1 : -1);
      showTip(el, cur + (e.key === 'ArrowLeft' ? -1 : 1));
    });
  }

  // ================= 필터 조작 =================
  $('#cats').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    const k = b.dataset.cat;
    if (!k) state.cats.clear();
    else if (state.cats.has(k)) state.cats.delete(k);
    else state.cats.add(k);
    if (state.cats.size === CATS.length) state.cats.clear();
    render();
  };
  $('#preset').onchange = e => {
    if (e.target.value === 'custom') { state.preset = 'custom'; renderFilters(); return; }
    setPreset(e.target.value);
    state.showAll.clear();
    render();
  };
  for (const id of ['#from', '#to']) {
    $(id).onchange = () => {
      const a = fromInput($('#from').value), b = fromInput($('#to').value);
      if (a == null || b == null) return;
      state.from = Math.min(a, b);
      state.to = Math.max(a, b);
      state.preset = matchPreset();
      render();
    };
  }
  $('#reset').onclick = () => { state.cats.clear(); state.showAll.clear(); setPreset(thisMonthKey()); render(); };

  // ================= 데이터 불러오기 =================
  let sb = null;

  // 탭을 오래 열어 두거나 PC 가 절전에서 깨어나면 만료된 로그인 토큰(JWT)으로 요청이 나갈 수 있어,
  // 요청 전에 세션을 확인하고, 그래도 JWT 오류가 나면 토큰을 새로 받아 한 번 더 시도
  async function query(make) {
    await sb.auth.getSession();
    let r = await make();
    if (r.error && /jwt/i.test(r.error.message || '')) {
      await sb.auth.refreshSession();
      r = await make();
    }
    if (r.error) throw r.error;
    return r.data;
  }

  async function loadOrders() {
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const data = await query(() => sb.from('booth_orders')
        .select('order_id, ordered_at, booth_order_items(line_no, name, price, gift)')
        .order('ordered_at').range(from, from + 999));
      rows.push(...data);
      if (data.length < 1000) break;
    }
    return rows.map(r => ({ ...r, items: (r.booth_order_items || []).sort((a, b) => a.line_no - b.line_no) }));
  }

  async function loadSync() {
    try {
      const row = await query(() => sb.from('booth_sync').select('checked_at').maybeSingle());
      return row ? Date.parse(row.checked_at) : null;
    } catch (e) {
      console.warn('booth_sync 를 읽지 못했어요 (booth_sales.sql 을 다시 실행하면 생겨요)', e);
      return null;
    }
  }

  function showData(rows, syncAt) {
    const first = !state.loadedAt;
    state.orders = normalize(rows);
    state.syncAt = syncAt;
    state.loadedAt = Date.now();
    renderPresetOptions();
    if (first) setPreset(thisMonthKey());
    document.body.classList.remove('is-loading');
    render();
  }
  function showError(msg) {
    document.body.classList.remove('is-loading');
    $('#sync').textContent = msg;
  }

  let loading = false;
  async function refresh() {
    if (loading || !sb) return;
    loading = true;
    try {
      const [rows, syncAt] = await Promise.all([loadOrders(), loadSync()]);
      showData(rows, syncAt);
    } catch (e) {
      console.error(e);
      const missing = /booth_orders|relation|schema cache/i.test(e.message || '');
      showError(missing ? 'Supabase에 주문 테이블이 아직 없어요. booth_sales.sql 을 먼저 실행해 주세요.' : '데이터를 불러오지 못했어요: ' + (e.message || e));
    } finally {
      loading = false;
    }
  }

  async function onSession(session) {
    state.live = !!session;
    if (!session) {
      if (window.midoriToLogin) return window.midoriToLogin();
      $('#who').textContent = '';
      $('#logout').hidden = true;
      $('#auth').classList.add('show');
      $('#sync').textContent = '로그인이 필요해요.';
      return;
    }
    $('#auth').classList.remove('show');
    $('#who').textContent = session.user.email;
    $('#logout').hidden = false;
    refresh();
  }

  async function init() {
    if (cfg.ORDERS_JSON) {
      $('#who').textContent = '로컬 미리보기';
      $('#reload').hidden = true;
      try { showData(await fetch(cfg.ORDERS_JSON).then(r => r.json()), cfg.PREVIEW_SYNC_AT ? Date.parse(cfg.PREVIEW_SYNC_AT) : null); }
      catch (e) { showError('미리보기 파일을 읽지 못했어요: ' + e.message); }
      return;
    }
    if (!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase)) {
      showError('config.js 에 Supabase 설정이 없어요.');
      return;
    }
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    let current; // 처음 INITIAL_SESSION(로그인 안 됨 = null)도 한 번은 처리되도록 undefined 로 시작
    sb.auth.onAuthStateChange((_ev, s) => {
      const id = s?.user?.id ?? null;
      if (id === current) return;
      current = id;
      setTimeout(() => onSession(s)); // 콜백 안에서 바로 쿼리하면 supabase-js 가 멈출 수 있어 다음 틱으로
    });
  }

  // 열어 둔 채로도 최신으로: 보이는 동안 5분마다, 다른 탭에 있다 돌아왔을 때 5분 넘었으면 다시 불러옴
  const STALE = 5 * 60e3;
  setInterval(() => { if (state.live && !document.hidden) refresh(); }, STALE);
  document.addEventListener('visibilitychange', () => {
    if (!state.live || document.hidden) return;
    if (Date.now() - state.loadedAt > STALE) refresh(); else renderSync();
  });
  setInterval(() => { if (!document.hidden) renderSync(); }, 60e3);
  // 자정을 넘기면 '어제/오늘' 이 바뀌어야 하므로 날짜가 바뀌면 다시 그림
  let shownDay = today();
  setInterval(() => { if (state.loadedAt && today() !== shownDay) { shownDay = today(); renderPresetOptions(); render(); } }, 60e3);

  $('#reload').onclick = refresh;
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    $('#authErr').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: $('#authEmail').value, password: $('#authPw').value });
    if (error) $('#authErr').textContent = error.message === 'Invalid login credentials' ? '이메일 또는 비밀번호가 맞지 않아요.' : error.message;
  };
  $('#logout').onclick = () => sb && sb.auth.signOut();

  init();
})();
</script>
</body>
</html>
