<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0c" media="(prefers-color-scheme: dark)">
<title>Studio Raming · midorichart</title>
<meta name="description" content="Studio Raming 포트폴리오 · 판매 페이지">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/site.css">
<style>
  :root { --wrap: 880px; }
  body { display: flex; flex-direction: column; }
  .wrap { flex: 1; width: 100%; }
  .intro { padding: 96px 0 48px; }
  .intro h1 {
    margin: 0;
    font-size: clamp(34px, 6vw, 60px);
    line-height: 1.1;
    letter-spacing: -0.035em;
    font-weight: 700;
  }
  .intro h1 span { color: var(--mute); }
  .intro p { margin: 20px 0 0; color: var(--ink-2); font-size: 16px; max-width: 46ch; }
  @media (max-width: 640px) { .intro { padding: 56px 0 36px; } }
</style>
</head>
<body>
<header class="site-head">
  <a class="brand" href="./"><span class="brand-mark"></span>midorichart</a>
</header>

<main class="wrap">
  <section class="intro">
    <p class="eyebrow">Studio Raming</p>
    <h1>포트폴리오와 판매 페이지를<br><span>준비하고 있어요.</span></h1>
    <p>작업물과 판매 중인 상품을 곧 이곳에서 소개할게요.</p>
  </section>
</main>

<footer class="site-foot">
  <span>© 2026 Studio Raming</span>
  <span>midorichart.com</span>
</footer>
</body>
</html>
