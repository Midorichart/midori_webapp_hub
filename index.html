<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>웹앱 허브</title>
    <style>
      :root {
        --bg-deep: #0b1020;
        --bg-surface: rgba(13, 23, 45, 0.7);
        --line: rgba(148, 174, 255, 0.2);
        --text: #e8edff;
        --muted: #a6b4d6;
        --accent: #7aa2ff;
        --accent-2: #52d6d1;
        --shadow: 0 18px 40px rgba(7, 11, 29, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 12% 18%, rgba(82, 214, 209, 0.18), transparent 42%),
          radial-gradient(circle at 86% 80%, rgba(122, 162, 255, 0.2), transparent 36%),
          linear-gradient(140deg, #090f20 0%, #111a35 38%, #151f39 100%);
        color: var(--text);
        font-family: "Trebuchet MS", "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
        display: flex;
        justify-content: center;
        padding: 48px 20px;
      }

      .app-shell {
        width: min(980px, 100%);
        display: grid;
        gap: 28px;
      }

      .topbar {
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 26px;
        background: linear-gradient(145deg, rgba(12, 22, 45, 0.9), rgba(17, 29, 57, 0.7));
        backdrop-filter: blur(2px);
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 3.5vw, 2.6rem);
        letter-spacing: 0.02em;
        line-height: 1.22;
      }

      p {
        margin: 14px 0 0;
        color: var(--muted);
        max-width: 62ch;
      }

      .meta {
        margin-top: 18px;
        color: #d0daff;
        font-size: 0.94rem;
      }

      .section-title {
        margin: 0;
        font-size: 1.05rem;
        letter-spacing: 0.04em;
        color: #d7e1ff;
      }

      .grid {
        margin: 0;
        list-style: none;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      .card {
        border-radius: 18px;
        border: 1px solid var(--line);
        background: var(--bg-surface);
        padding: 18px;
        transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      }

      .card:hover {
        transform: translateY(-3px);
        border-color: rgba(122, 162, 255, 0.6);
        box-shadow: 0 12px 28px rgba(9, 16, 36, 0.45);
      }

      .badge {
        display: inline-block;
        margin-bottom: 12px;
        font-size: 0.75rem;
        font-weight: 700;
        color: #0b1020;
        padding: 4px 10px;
        border-radius: 999px;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
      }

      .card h3 {
        margin: 0;
        font-size: 1.2rem;
      }

      .card p {
        margin-top: 8px;
        min-height: 46px;
      }

      .actions {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      a.button {
        text-decoration: none;
        border-radius: 12px;
        padding: 10px 14px;
        border: 1px solid rgba(122, 162, 255, 0.4);
        color: #f3f6ff;
        font-weight: 600;
      }

      a.primary {
        background: linear-gradient(120deg, rgba(122, 162, 255, 0.95), rgba(82, 214, 209, 0.8));
        color: #091027;
      }

      a.button:hover {
        opacity: 0.9;
      }

      .footer {
        color: #90a0c4;
        font-size: 0.9rem;
        border-top: 1px dashed rgba(140, 160, 220, 0.2);
        padding-top: 16px;
        margin-top: 8px;
      }

      @media (max-width: 620px) {
        body {
          padding: 22px 14px 30px;
        }

        .topbar {
          padding: 20px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>내 웹앱 허브</h1>
        <p>
          여러 웹앱을 한곳에서 모아 관리하는 개인 랜딩 페이지입니다.
          현재는 작업 중인 앱을 점진적으로 추가할 수 있고, 추후 프로젝트 단위로 구분해 확장할 예정입니다.
        </p>
        <p class="meta">최종 업데이트: <strong>2026-09-12</strong></p>
      </header>

      <section>
        <h2 class="section-title">웹앱 목록</h2>
        <ul class="grid">
          <li class="card">
            <span class="badge">우선 공개</span>
            <h3>TaskManager</h3>
            <p>일정을 관리하고 작업 흐름을 정리할 수 있는 앱</p>
            <div class="actions">
              <a class="button primary" href="https://midorichart.github.io/TaskManager/" target="_blank" rel="noopener noreferrer">바로 가기</a>
              <a class="button" href="https://midorichart.github.io/TaskManager/" target="_blank" rel="noopener noreferrer">새 탭 열기</a>
            </div>
          </li>
        </ul>
      </section>

      <footer class="footer">
        새로운 웹앱 링크만 추가하면 바로 페이지가 업데이트됩니다. 예: 노트 앱, 대시보드, 기록 툴, 실험 앱 등.
      </footer>
    </main>
  </body>
</html>
